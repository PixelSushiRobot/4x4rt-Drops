<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive art with 16 blocks for #Art4LifeTez event.">
  <title>4x4rt Drops</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #2d1f1a;
      --paper: #fff8f0;
      --focus: hsl(0, 100%, 50%);
      --ui-text-main: rgba(45, 31, 26, 0.9);
      --ui-ink-muted: rgba(45, 31, 26, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--paper);
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: grid;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      background: var(--paper);
    }

    figure {
      position: relative;
      width: min(100vmin, 100vw);
      max-width: 100%;
      aspect-ratio: 1;
      margin: 0;
      /* Establish a container query context so child UI scales vectorially */
      container-type: inline-size;
    }

    svg#artwork {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      shape-rendering: crispEdges;
      touch-action: none;
      user-select: none;
    }

    svg#artwork:focus-visible {
      box-shadow: inset 0 0 0 10px var(--focus);
    }

    /* ==========================================================================
       Proportional HTML UI Overlay System (100cqw matches the 1000px canvas)
       ========================================================================== */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
    }

    /* Default to hidden per the 'I' shortcut requirements */
    .ui-layer.ui-hidden {
      opacity: 0;
    }

    /* Dynamic Scaling Header (20px padding = 2cqw) */
    .project-header {
      position: absolute;
      top: 2cqw;
      left: 2cqw;
      color: var(--ui-text-main);
      font-family: 'Space Mono', monospace;
      line-height: 1;
      letter-spacing: 0.1cqw;
    }

    .project-header .label {
      font-size: 1.5cqw;
      font-weight: 400;
      margin-bottom: 0.4cqw;
      /* Precise 4px line gap context */
    }

    .project-header .title {
      font-size: 3cqw;
      font-weight: 400;
    }

    /* Dynamic Scaling Watermark (Width matching 90px layout = 9cqw) */
    .watermark-container {
      position: absolute;
      bottom: 2cqw;
      right: 2cqw;
      width: 9cqw;
      height: 3cqw;
    }

    .watermark-container svg {
      display: block;
      width: 100%;
      height: 100%;
      shape-rendering: crispEdges;
    }

    /* Interactive block core targets */
    [data-key] {
      cursor: pointer;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
  </style>
</head>

<body>
  <main aria-labelledby="art-title">
    <h1 id="art-title" class="sr-only">4x4rt Drops — #Art4LifeTez</h1>

    <figure aria-describedby="art-description">

      <svg id="artwork" role="img" tabindex="0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
        aria-label="4x4rt Drops — Interactive Pixel Heart Color Game">
      </svg>

      <div id="ui-overlay" class="ui-layer ui-hidden" aria-hidden="true">
        <div class="project-header">
          <div class="label">PROJECT</div>
          <div class="title">4X4RT DROPS</div>
        </div>

        <div class="watermark-container">
          <svg viewBox="0 0 90 30" preserveAspectRatio="xMaxYMax meet" xmlns="http://www.w3.org/2000/svg">
            <g fill="var(--ui-ink-muted)">
              <rect width="24" height="6" />
              <rect y="16" width="24" height="6" />
              <rect y="24" width="12" height="6" />
              <rect x="12" y="8" width="18" height="6" />

              <rect x="30" y="8" width="24" height="6" />
              <rect x="30" y="24" width="24" height="6" />
              <rect x="36" width="24" height="6" />
              <rect x="36" y="16" width="24" height="6" />

              <rect x="60" width="24" height="6" />
              <rect x="60" y="16" width="24" height="6" />
              <rect x="60" y="24" width="12" height="6" />
              <rect x="72" y="8" width="18" height="6" />
              <rect x="78" y="24" width="12" height="6" />
            </g>
          </svg>
        </div>
      </div>

      <figcaption id="art-description" class="sr-only">
        An interactive puzzle of a pixel heart made from 16 interlocking blocks. Press and hold individual blocks to
        shift their red color level. Balance all blocks to an equal color value to complete the puzzle and automatically
        load a new random board.
      </figcaption>
    </figure>
  </main>

  <script>
    (() => {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      const INK = "#2d1f1a";
      const PAPER = "#fff8f0";
      const SIZE = 1000;
      const CELL = 160;
      const BORDER = 10;
      const STEP = CELL - BORDER;
      const HOLD_DURATION = 1800;
      const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const MIN_L = 8;
      const MAX_L = 97;

      const BALANCE_THRESHOLD = 11.5;
      const WAVE_FLASH_COLOR = PAPER;

      const CELLS = [
        [1, 0], [3, 0],
        [0, 1], [2, 1], [4, 1],
        [1, 2], [3, 2],
        [2, 3]
      ];

      const offsetX = Math.round((SIZE - (5 * CELL - 4 * BORDER)) / 2);
      const offsetY = Math.round((SIZE - (4 * CELL - 3 * BORDER)) / 2);
      const svg = document.getElementById("artwork");
      const uiOverlay = document.getElementById("ui-overlay");
      const fillRects = new Map();

      let cellStates = {};
      let targetStates = {};
      let holdInterval = null;
      let holdStart = 0;
      let activeKey = null;
      let activeTimers = [];
      let successTimers = [];
      let pointerIsDown = false;
      let isCelebrating = false;
      let initialDonorL = 0;
      let accumulatedGainedPool = 0;
      let continuousPlaySeedShift = null;
      let forcedRandomSession = null;

      function getSeedSource() {
        if (forcedRandomSession !== null) {
          return `4x4rt-Drops:Art4LifeTez:ForcedRandomSession:${forcedRandomSession}`;
        }
        if (continuousPlaySeedShift !== null) {
          return `4x4rt-Drops:Art4LifeTez:NextSession:${continuousPlaySeedShift}`;
        }

        const params = new URLSearchParams(window.location.search);
        const parts = [
          params.get("viewer"),
          params.get("wallet"),
          params.get("address"),
          params.get("creator"),
          params.get("objkt"),
          params.get("seed")
        ].filter(Boolean);

        if (parts.length > 0) {
          return parts.join(":");
        } else {
          return `4x4rt-Drops:Art4LifeTez:AnonymousSession:${Math.random()}`;
        }
      }

      function xmur3(source) {
        let h = 1779033703 ^ source.length;
        for (let i = 0; i < source.length; i += 1) {
          h = Math.imul(h ^ source.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        return () => {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          return (h ^= h >>> 16) >>> 0;
        };
      }

      function mulberry32(seed) {
        return () => {
          let t = seed += 0x6d2b79f5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      let prng = mulberry32(xmur3(getSeedSource())());

      function cellX(col) { return offsetX + col * STEP; }
      function cellY(row) { return offsetY + row * STEP; }

      function getCellColorString(L) {
        if (L >= MAX_L) {
          return PAPER;
        }
        if (L > 85) {
          const factor = (L - 85) / (MAX_L - 85);
          const currentHue = Math.round(0 + (34 * factor));
          const currentLightness = (85 + (12 * factor)).toFixed(1);
          return `hsl(${currentHue}, 100%, ${currentLightness}%)`;
        }
        return `hsl(0, 100%, ${L}%)`;
      }

      function setFill(key, L) {
        const rect = fillRects.get(key);
        if (rect) {
          rect.setAttribute("fill", getCellColorString(L));
        }
      }

      function setRawFillColor(key, cssColor) {
        const rect = fillRects.get(key);
        if (rect) {
          rect.setAttribute("fill", cssColor);
        }
      }

      function settleAllCellsNow() {
        activeTimers.forEach((timer) => window.clearTimeout(timer));
        activeTimers = [];

        Object.keys(targetStates).forEach((key) => {
          cellStates[key] = targetStates[key];
          setFill(key, cellStates[key]);
        });

        targetStates = { ...cellStates };
      }

      function generatePalette() {
        CELLS.forEach(([col, row]) => {
          const key = `${col},${row}`;
          cellStates[key] = MIN_L + prng() * (80 - MIN_L);
        });
        targetStates = { ...cellStates };
      }

      function createSvgElement(tagName, attributes = {}) {
        const element = document.createElementNS(SVG_NS, tagName);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        return element;
      }

      function addRect(attributes) {
        const rect = createSvgElement("rect", attributes);
        svg.appendChild(rect);
        return rect;
      }

      function checkForColorBalanceSuccess() {
        const currentLightnessValues = Object.values(cellStates);
        if (currentLightnessValues.length === 0) return;

        const maxL = Math.max(...currentLightnessValues);
        const minL = Math.min(...currentLightnessValues);
        const delta = maxL - minL;

        if (delta <= BALANCE_THRESHOLD) {
          triggerSuccessCelebration();
        }
      }

      function triggerSuccessCelebration() {
        isCelebrating = true;
        pointerIsDown = false;
        activeKey = null;

        activeTimers.forEach((timer) => window.clearTimeout(timer));
        activeTimers = [];
        successTimers.forEach((timer) => window.clearTimeout(timer));
        successTimers = [];

        const centerCol = 2;
        const centerRow = 1.5;

        const waveSpeed = 160;
        const wave2Delay = 200;
        const colorHoldDuration = 180;

        continuousPlaySeedShift = Math.random();
        prng = mulberry32(xmur3(getSeedSource())());

        const nextStates = {};
        CELLS.forEach(([col, row]) => {
          nextStates[`${col},${row}`] = MIN_L + prng() * (80 - MIN_L);
        });

        CELLS.forEach(([col, row]) => {
          const key = `${col},${row}`;
          const distance = Math.hypot(col - centerCol, row - centerRow);

          const t1_arrive = REDUCED_MOTION ? 0 : Math.round(distance * waveSpeed);
          const t1_fade = t1_arrive + colorHoldDuration;

          const t2_arrive = t1_fade + wave2Delay;
          const t2_collapse = t2_arrive + colorHoldDuration;

          const w1OnTimer = window.setTimeout(() => {
            setRawFillColor(key, "#ffffff");
          }, t1_arrive);

          const w1ClearTimer = window.setTimeout(() => {
            setRawFillColor(key, "rgba(45, 31, 26, 0.18)");
          }, t1_fade);

          const w2OnTimer = window.setTimeout(() => {
            setRawFillColor(key, PAPER);
          }, t2_arrive);

          const collapseTimer = window.setTimeout(() => {
            cellStates[key] = nextStates[key];
            targetStates[key] = nextStates[key];
            setFill(key, cellStates[key]);

            if (key === `${CELLS[CELLS.length - 1][0]},${CELLS[CELLS.length - 1][1]}`) {
              isCelebrating = false;
            }
          }, t2_collapse);

          successTimers.push(w1OnTimer, w1ClearTimer, w2OnTimer, collapseTimer);
        });
      }

      function fireDrainageWave(sourceCol, sourceRow, speed, finalGainedPool, sourceKey) {
        const recipientCells = CELLS.filter(([col, row]) => `${col},${row}` !== sourceKey);
        if (recipientCells.length === 0) return;

        const tollPerRecipient = finalGainedPool / recipientCells.length;
        let completedAnimationsCount = 0;

        recipientCells.forEach(([col, row]) => {
          const key = `${col},${row}`;
          const distance = Math.hypot(col - sourceCol, row - sourceRow);

          const arriveDelay = REDUCED_MOTION ? 0 : Math.round(distance * speed);
          const flashDuration = REDUCED_MOTION ? 80 : 180;
          const snapDelay = arriveDelay + flashDuration;

          const startL = cellStates[key];
          const targetL = Math.max(MIN_L, startL - tollPerRecipient);

          targetStates[key] = targetL;

          const arriveTimer = window.setTimeout(() => {
            if (isCelebrating) return;
            setRawFillColor(key, WAVE_FLASH_COLOR);
          }, arriveDelay);

          const snapTimer = window.setTimeout(() => {
            if (isCelebrating) return;
            cellStates[key] = targetL;
            setFill(key, targetL);

            completedAnimationsCount++;
            if (completedAnimationsCount === recipientCells.length) {
              checkForColorBalanceSuccess();
            }
          }, snapDelay);

          activeTimers.push(arriveTimer, snapTimer);
        });
      }

      function startHold(col, row, key) {
        if (isCelebrating) return;

        settleAllCellsNow();

        if (pointerIsDown && activeKey === key) return;

        pointerIsDown = true;
        activeKey = key;
        holdStart = Date.now();
        initialDonorL = cellStates[key];
        accumulatedGainedPool = 0;

        const instantClickStep = (MAX_L - initialDonorL) * 0.12;
        let steppedL = initialDonorL + instantClickStep;
        if (steppedL > MAX_L) steppedL = MAX_L;

        accumulatedGainedPool = steppedL - initialDonorL;
        cellStates[key] = steppedL;
        targetStates[key] = steppedL;
        setFill(key, steppedL);

        window.clearInterval(holdInterval);
        holdInterval = window.setInterval(() => {
          if (isCelebrating) {
            window.clearInterval(holdInterval);
            return;
          }
          const elapsed = Date.now() - holdStart;
          const progress = Math.min(1, elapsed / HOLD_DURATION);

          const maxGrowthHeadroom = MAX_L - steppedL;
          const currentGainTarget = maxGrowthHeadroom * progress;

          let updatedDonorL = steppedL + currentGainTarget;
          if (updatedDonorL > MAX_L) updatedDonorL = MAX_L;

          accumulatedGainedPool = updatedDonorL - initialDonorL;
          cellStates[key] = updatedDonorL;
          targetStates[key] = updatedDonorL;
          setFill(key, updatedDonorL);

          if (progress >= 1) {
            window.clearInterval(holdInterval);
          }
        }, REDUCED_MOTION ? 80 : 16);
      }

      function releaseHold() {
        window.clearInterval(holdInterval);
        holdInterval = null;

        if (isCelebrating || !pointerIsDown) {
          pointerIsDown = false;
          return;
        }
        pointerIsDown = false;

        const key = activeKey;
        const totalGained = accumulatedGainedPool;

        if (!key) return;

        const [sourceCol, sourceRow] = key.split(",").map(Number);

        if (totalGained > 0) {
          fireDrainageWave(sourceCol, sourceRow, 45, totalGained, key);
        }

        activeKey = null;
        accumulatedGainedPool = 0;
      }

      function buildArtwork() {
        generatePalette();

        Array.from(svg.querySelectorAll("svg > rect")).forEach((rect) => rect.remove());
        fillRects.clear();

        addRect({
          x: 0,
          y: 0,
          width: SIZE,
          height: SIZE,
          fill: PAPER
        });

        CELLS.forEach(([col, row]) => {
          const key = `${col},${row}`;
          const x = cellX(col);
          const y = cellY(row);

          addRect({
            x,
            y,
            width: CELL,
            height: CELL,
            fill: INK
          });

          fillRects.set(key, addRect({
            x: x + BORDER,
            y: y + BORDER,
            width: CELL - BORDER * 2,
            height: CELL - BORDER * 2,
            fill: getCellColorString(cellStates[key])
          }));

          addRect({
            x,
            y,
            width: CELL,
            height: CELL,
            fill: "transparent",
            "data-key": key,
            "data-col": col,
            "data-row": row
          });
        });
      }

      // --- ADVANCED TOOLKIT EXPORT PIPELINES ---
      function downloadPngExport() {
        const outputCanvasSize = 2000;
        const scaleFactor = outputCanvasSize / SIZE;

        const canvas = document.createElement("canvas");
        canvas.width = outputCanvasSize;
        canvas.height = outputCanvasSize;
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = PAPER;
        ctx.fillRect(0, 0, outputCanvasSize, outputCanvasSize);

        CELLS.forEach(([col, row]) => {
          const key = `${col},${row}`;
          const x = cellX(col) * scaleFactor;
          const y = cellY(row) * scaleFactor;
          const w = CELL * scaleFactor;
          const borderOffset = BORDER * scaleFactor;

          ctx.fillStyle = INK;
          ctx.fillRect(x, y, w, w);

          const elementStyleColor = fillRects.get(key).getAttribute("fill");
          ctx.fillStyle = elementStyleColor;
          ctx.fillRect(x + borderOffset, y + borderOffset, w - borderOffset * 2, w - borderOffset * 2);
        });

        const link = document.createElement("a");
        link.download = "4x4rt_drops.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      function downloadSvgExport() {
        const svgClone = svg.cloneNode(true);
        svgClone.removeAttribute("tabindex");
        svgClone.removeAttribute("id");

        const svgSerializerString = new XMLSerializer().serializeToString(svgClone);
        const dataBlob = new Blob([svgSerializerString], { type: "image/svg+xml;charset=utf-8" });
        const objectBlobUrl = URL.createObjectURL(dataBlob);

        const link = document.createElement("a");
        link.download = "4x4rt_drops.svg";
        link.href = objectBlobUrl;
        link.click();

        window.setTimeout(() => URL.revokeObjectURL(objectBlobUrl), 10);
      }

      buildArtwork();

      svg.addEventListener("pointerdown", (event) => {
        const target = event.target.closest("[data-key]");
        if (!target) return;

        event.preventDefault();
        target.setPointerCapture(event.pointerId);
        startHold(
          Number(target.dataset.col),
          Number(target.dataset.row),
          target.dataset.key
        );
      });

      svg.addEventListener("pointerup", releaseHold);
      svg.addEventListener("pointercancel", releaseHold);
      svg.addEventListener("pointerleave", releaseHold);

      // Global Keydown Router Integration
      svg.addEventListener("keydown", (event) => {
        if (event.metaKey || event.ctrlKey) {
          return;
        }

        const shortcutInputKey = event.key.toLowerCase();

        // 1. Toggle Project Meta Visibility ('i')
        if (shortcutInputKey === "i") {
          event.preventDefault();
          uiOverlay.classList.toggle("ui-hidden");
          return;
        }

        // 2. Force True Randomized Generation Bypass Sequence ('r')
        if (shortcutInputKey === "r") {
          event.preventDefault();

          activeTimers.forEach((timer) => window.clearTimeout(timer));
          successTimers.forEach((timer) => window.clearTimeout(timer));
          window.clearInterval(holdInterval);

          isCelebrating = false;
          pointerIsDown = false;
          activeKey = null;

          forcedRandomSession = Math.random();
          prng = mulberry32(xmur3(getSeedSource())());
          buildArtwork();
          return;
        }

        // 3. High-res Raster 2000x2000 PNG Downloader Export Link ('p')
        if (shortcutInputKey === "p") {
          event.preventDefault();
          downloadPngExport();
          return;
        }

        // 4. Standalone Vector 1000x1000 SVG Export Link ('s')
        if (shortcutInputKey === "s") {
          event.preventDefault();
          downloadSvgExport();
          return;
        }

        // 5. Classic Interactive Click Simulation Actions Target Handlers
        if (isCelebrating) return;
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (CELLS.length > 0) {
            const randomCell = CELLS[Math.floor(prng() * CELLS.length)];
            const key = `${randomCell[0]},${randomCell[1]}`;

            settleAllCellsNow();

            const currentL = cellStates[key];
            const capacity = MAX_L - currentL;
            const stepGain = capacity * 0.40;
            const finalDonorL = Math.min(MAX_L, currentL + stepGain);
            const absoluteGained = finalDonorL - currentL;

            cellStates[key] = finalDonorL;
            targetStates[key] = finalDonorL;
            setFill(key, finalDonorL);

            fireDrainageWave(randomCell[0], randomCell[1], 45, absoluteGained, key);
          }
        }
      });
    })();
  </script>
</body>

</html>
