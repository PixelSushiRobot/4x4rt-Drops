<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Interactive pixel heart for World Blood Donor Day: Art for Life — giving blood is giving life.">
  <title>Art for Life — World Blood Donor Day</title>
  <style>
    :root {
      --ink: #2d1f1a;
      --paper: #fff8f0;
      --focus: #c44d34;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--paper);
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: grid;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      background: var(--paper);
    }

    figure {
      width: min(100vmin, 100vw);
      max-width: 100%;
      aspect-ratio: 1;
      margin: 0;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      outline: none;
      shape-rendering: crispEdges;
      touch-action: none;
      user-select: none;
    }

    svg:focus-visible {
      box-shadow: inset 0 0 0 10px var(--focus);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
  </style>
</head>

<body>
  <main aria-labelledby="art-title">
    <h1 id="art-title" class="sr-only">Art for Life — World Blood Donor Day</h1>
    <figure aria-describedby="art-description">
      <svg id="artwork" role="img" tabindex="0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
        aria-labelledby="svg-title svg-description">
        <title id="svg-title">Art for Life — an interactive pixel heart</title>
        <desc id="svg-description">
          A warm, blocky heart built from life-giving colors.
          Press and hold any block to charge it, then release to send a joyful pulse through the artwork.
          Giving blood is giving life — celebrate World Blood Donor Day.
        </desc>
      </svg>
      <figcaption id="art-description" class="sr-only">
        Press and hold any heart block to alter its color and release a wave through the artwork.
      </figcaption>
    </figure>
  </main>

  <script>
    (() => {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      const INK = "#2d1f1a";
      const PAPER = "#fff8f0";
      const SIZE = 1000;
      const CELL = 160;
      const BORDER = 10;
      const STEP = CELL - BORDER;
      const HOLD_DURATION = 2000;
      const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const CELLS = [
        [1, 0], [3, 0],
        [0, 1], [2, 1], [4, 1],
        [1, 2], [3, 2],
        [2, 3]
      ];

      const offsetX = Math.round((SIZE - (5 * CELL - 4 * BORDER)) / 2);
      const offsetY = Math.round((SIZE - (4 * CELL - 3 * BORDER)) / 2);
      const svg = document.getElementById("artwork");
      const fillRects = new Map();
      const hitAreas = new Map();

      let baseColors = {};
      let holdInterval = null;
      let holdStart = 0;
      let chargeAmount = 0;
      let activeKey = null;
      let activeTimers = [];
      let pointerIsDown = false;

      function getSeedSource() {
        const params = new URLSearchParams(window.location.search);
        const parts = [
          params.get("viewer"),
          params.get("wallet"),
          params.get("address"),
          params.get("creator"),
          params.get("objkt"),
          params.get("seed")
        ].filter(Boolean);

        return parts.length > 0
          ? parts.join(":")
          : "4x4rt-Drops:Art4LifeTez:PixelSushiRobot";
      }

      function xmur3(source) {
        let h = 1779033703 ^ source.length;
        for (let i = 0; i < source.length; i += 1) {
          h = Math.imul(h ^ source.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        return () => {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          return (h ^= h >>> 16) >>> 0;
        };
      }

      function mulberry32(seed) {
        return () => {
          let t = seed += 0x6d2b79f5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const random = mulberry32(xmur3(getSeedSource())());

      function cellX(col) {
        return offsetX + col * STEP;
      }

      function cellY(row) {
        return offsetY + row * STEP;
      }

      function hexToRgb(hex) {
        const value = hex.replace("#", "");
        return [
          parseInt(value.slice(0, 2), 16),
          parseInt(value.slice(2, 4), 16),
          parseInt(value.slice(4, 6), 16)
        ];
      }

      function rgbToHex(red, green, blue) {
        return "#" + [red, green, blue]
          .map((value) => Math.max(0, Math.min(255, Math.round(value))))
          .map((value) => value.toString(16).padStart(2, "0"))
          .join("");
      }

      function lerpColor(start, end, amount) {
        const [startRed, startGreen, startBlue] = hexToRgb(start);
        const [endRed, endGreen, endBlue] = hexToRgb(end);

        return rgbToHex(
          startRed + (endRed - startRed) * amount,
          startGreen + (endGreen - startGreen) * amount,
          startBlue + (endBlue - startBlue) * amount
        );
      }

      /**
       * CRITICAL COLOR RE-ENGINEERING:
       * Instead of mixing hexes (which creates mud/brown), we directly recalculate
       * the RGB channels based on pure Red laws. Green and Blue are hard-capped low
       * to stay completely away from pink, orange, or brown.
       */

      // Donating cell empties out, spiking into an un-diluted pure electric neon red
      function giveLifeShift(hex, amount = 1) {
        const [r, g, b] = hexToRgb(hex);
        // Push Red straight to the maximum ceil, drop green/blue to clean laser floors
        const targetR = r + (255 - r) * amount;
        const targetG = g * (1 - amount);
        const targetB = b * (1 - amount);
        return rgbToHex(targetR, targetG, targetB);
      }

      // Absorbing cell packs in the blood, dropping the red channel low, 
      // but completely draining green/blue to maintain pristine crimson saturation.
      function absorbLifeShift(hex, amount) {
        const [r, g, b] = hexToRgb(hex);

        // Drop the red channel down to form a rich dark blood tone (capped at floor 65)
        const targetR = Math.max(65, r - (r - 65) * amount * 0.65);
        // Aggressively wipe green and blue to protect the pure red tone from rotting into brown
        const targetG = Math.max(0, g - (g * amount * 0.9));
        const targetB = Math.max(0, b - (b * amount * 0.9));

        return rgbToHex(targetR, targetG, targetB);
      }

      function rand(min, max) {
        return min + random() * (max - min);
      }

      // Initialized seeds generate gorgeous balanced ranges of bright and velvet reds
      function randomBrightRed() {
        const band = random();

        // 1. Pure Electric Red
        if (band < 0.20) {
          return rgbToHex(rand(245, 255), 0, 0);
        }
        // 2. Ruby Mid-Tone Red
        if (band < 0.40) {
          return rgbToHex(rand(210, 235), 0, rand(4, 10));
        }
        // 3. Deep Velvet Crimson
        if (band < 0.60) {
          return rgbToHex(rand(140, 175), 0, rand(4, 8));
        }
        // 4. Heavy Blood Maroon
        if (band < 0.80) {
          return rgbToHex(rand(95, 130), 0, rand(2, 6));
        }
        // 5. Vivid Cherry
        return rgbToHex(rand(235, 255), rand(2, 8), rand(4, 12));
      }

      function generatePalette() {
        return CELLS.reduce((colors, [col, row]) => {
          colors[`${col},${row}`] = randomBrightRed();
          return colors;
        }, {});
      }

      function createSvgElement(tagName, attributes = {}) {
        const element = document.createElementNS(SVG_NS, tagName);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        return element;
      }

      function addRect(attributes) {
        const rect = createSvgElement("rect", attributes);
        svg.appendChild(rect);
        return rect;
      }

      function setFill(key, color) {
        const rect = fillRects.get(key);
        if (rect) {
          rect.setAttribute("fill", color);
        }
      }

      function cancelTimers() {
        activeTimers.forEach((timer) => window.clearTimeout(timer));
        activeTimers = [];
      }

      function fireDonationWave(sourceCol, sourceRow, speed, charge) {
        cancelTimers();
        const donationImpact = Math.max(0.20, charge);

        CELLS.forEach(([col, row]) => {
          const key = `${col},${row}`;

          if (col === sourceCol && row === sourceRow) {
            return;
          }

          const distance = Math.hypot(col - sourceCol, row - sourceRow);
          const arriveDelay = REDUCED_MOTION ? 0 : Math.round(distance * speed);
          const flashDuration = REDUCED_MOTION ? 120 : Math.round(speed * 1.2) + 120;
          const snapDelay = arriveDelay + flashDuration;

          const arriveTimer = window.setTimeout(() => {
            // Flash color curves deep down during wave front passage
            const waveColor = absorbLifeShift(baseColors[key], donationImpact * 1.4);
            setFill(key, waveColor);
          }, arriveDelay);

          const snapTimer = window.setTimeout(() => {
            // Commit permanent absorption shifts securely
            const finalDarkerColor = absorbLifeShift(baseColors[key], donationImpact);
            baseColors[key] = finalDarkerColor;
            setFill(key, finalDarkerColor);
          }, snapDelay);

          activeTimers.push(arriveTimer, snapTimer);
        });
      }

      function startHold(col, row, key) {
        if (pointerIsDown && activeKey === key) {
          return;
        }

        cancelTimers();
        pointerIsDown = true;
        activeKey = key;
        chargeAmount = 0;
        holdStart = Date.now();

        window.clearInterval(holdInterval);

        holdInterval = window.setInterval(() => {
          chargeAmount = Math.min(1, (Date.now() - holdStart) / HOLD_DURATION);
          setFill(key, giveLifeShift(baseColors[key], chargeAmount));
        }, REDUCED_MOTION ? 80 : 30);
      }

      function releaseHold() {
        if (holdInterval === null) {
          pointerIsDown = false;
          return;
        }

        window.clearInterval(holdInterval);
        holdInterval = null;
        pointerIsDown = false;

        const key = activeKey;
        const charge = chargeAmount;

        activeKey = null;
        chargeAmount = 0;

        if (!key) {
          return;
        }

        const [sourceCol, sourceRow] = key.split(",").map(Number);

        // Lock donor cell cleanly into maximum electric brightness
        const finalDonorColor = giveLifeShift(baseColors[key], Math.max(0.20, charge));
        baseColors[key] = finalDonorColor;
        setFill(key, finalDonorColor);

        fireDonationWave(sourceCol, sourceRow, 45, charge);
      }

      function buildArtwork() {
        baseColors = generatePalette();
        Array.from(svg.querySelectorAll("rect")).forEach((rect) => rect.remove());
        fillRects.clear();
        hitAreas.clear();

        addRect({
          x: 0,
          y: 0,
          width: SIZE,
          height: SIZE,
          fill: PAPER
        });

        CELLS.forEach(([col, row]) => {
          const key = `${col},${row}`;
          const x = cellX(col);
          const y = cellY(row);

          addRect({
            x,
            y,
            width: CELL,
            height: CELL,
            fill: INK
          });

          fillRects.set(key, addRect({
            x: x + BORDER,
            y: y + BORDER,
            width: CELL - BORDER * 2,
            height: CELL - BORDER * 2,
            fill: baseColors[key]
          }));

          const hitArea = addRect({
            x,
            y,
            width: CELL,
            height: CELL,
            fill: "transparent",
            "data-key": key,
            "data-col": col,
            "data-row": row
          });

          hitArea.style.cursor = "pointer";
          hitAreas.set(key, hitArea);
        });
      }

      buildArtwork();

      svg.addEventListener("pointerdown", (event) => {
        const target = event.target.closest("[data-key]");
        if (!target) {
          return;
        }

        event.preventDefault();
        target.setPointerCapture(event.pointerId);
        startHold(
          Number(target.dataset.col),
          Number(target.dataset.row),
          target.dataset.key
        );
      });

      svg.addEventListener("pointerup", releaseHold);
      svg.addEventListener("pointercancel", releaseHold);
      svg.addEventListener("pointerleave", releaseHold);

      svg.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (CELLS.length > 0) {
            const centerCol = CELLS.reduce((s, [, r]) => s + r, 0) / CELLS.length;
            const centerRow = CELLS.reduce((s, [, r]) => s + r, 0) / CELLS.length;
            const nearest = CELLS.reduce((best, cell) => {
              const d = Math.hypot(cell[1] - centerRow, cell[0] - centerCol);
              return d < best.dist ? { cell, dist: d } : best;
            }, { cell: CELLS[0], dist: Infinity }).cell;

            const keyKey = `${nearest[0]},${nearest[1]}`;
            const keyDonorColor = giveLifeShift(baseColors[keyKey], 0.5);
            baseColors[keyKey] = keyDonorColor;
            setFill(keyKey, keyDonorColor);

            fireDonationWave(nearest[0], nearest[1], 45, 0.4);
          }
        }
      });
    })();
  </script>
</body>

</html>
